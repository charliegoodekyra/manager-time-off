<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Manager Time Off — Offline</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(520px,100%);background:white;border-radius:18px;padding:26px;box-shadow:0 2px 10px #0002}
.icon{width:64px;height:64px;border-radius:18px;background:#111827;display:grid;place-items:center;margin-bottom:18px;border-bottom:5px solid #ffc72c}
h1{margin:0 0 10px;font-size:25px}
p{line-height:1.5;color:#4b5563}
.note{padding:12px 14px;border-radius:12px;background:#fff8e7;color:#8a5a00;font-weight:700;font-size:14px}
button{width:100%;border:0;border-radius:11px;background:#16a34a;color:white;font:inherit;font-weight:800;padding:13px;margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <div class="icon"></div>
  <h1>No connection</h1>
  <p>Manager Time Off cannot reach the live admin data at the moment.</p>
  <div class="note">Requests and approval changes are not saved offline. Reconnect before making changes.</div>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
